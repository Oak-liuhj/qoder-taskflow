<style data-source="deepseek-harness/dsh-v0.2.2-rc.2/ui-theme">/* Base variables referenced by the token sheets and component CSS but defined
 * upstream (deepsuite theme/global.css) — supplied here so the composite
 * --dsw-font-* variables resolve and motion rides the upstream curve. Code
 * font stack deliberately omits a bare `monospace` tail (Windows CJK falls
 * back to SimSun otherwise). */
:root {
  --dsh-font-family-text-default: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-family: var(--dsh-font-family-text-default);
  --dsw-font-family-brand: 'Montserrat', var(--dsh-font-family-text-default);
  --dsh-font-family-code-default: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-font-family-code: var(--dsh-font-family-code-default);
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
  --ds-transition-duration-fast: 0.1s;
  --ds-transition-duration-slow: 0.3s;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-radius-panel: 28px;
}

/* User font lists (--dsh-font-family-text/-code, written on body by the theme
 * boot script and ThemePresenter) lead the built-in stacks. An unset list
 * falls back to the built-in stack itself; the repeated families are inert. */
body {
  --dsw-font-family: var(--dsh-font-family-text, var(--dsh-font-family-text-default)), var(--dsh-font-family-text-default);
  --ds-font-family-code: var(--dsh-font-family-code, var(--dsh-font-family-code-default)), var(--dsh-font-family-code-default);
  --dsw-alias-settings-card-fill: var(--dsw-alias-bg-layer-2);
  --dsw-alias-settings-card-stroke: var(--dsw-alias-border-l4);
}

[data-dsh-automatic-focus]:focus,
[data-dsh-automatic-focus]:focus:focus-visible {
  outline: none;
}

 (P().messages[s.id]??=[]).push({role:'user',text,time:time()});state.ui.augment=null;

function prd(){modal('持久任务编排 · PRD V4.1','<div class="prd"><div class="notice blue">2026-11-13 · 按用户最新需求修订<br>官方样式基准：DeepSeek Harness 0.2.2-rc.2（2026-11-11 发布）</div><h3>1. 核心流程</h3><div class="flow"><span>模型规划</span>→<span>按需委派</span>→<span>执行完成</span>→<span>自动勾选</span>→<span>通知直接父任务</span></div><p>子会话依据本项任务完成标准执行，保存结果后立即完成，并向直接父会话发送摘要。父会话无需确认、批准或重新核对。执行失败或仍有未完成步骤时不标记完成。</p><h3>2. 任务与会话</h3><p>右侧直接按父子层级展示持久待办清单，不按阶段、类型或“计划增补”分组。筛选后仍保留匹配事项的上层任务，避免丢失归属。左侧展示真实会话树。轻量事项继续在负责会话上下文中执行，同时生成挂在该父会话下的只读记录子会话，保存过程和结果，不额外调用模型或占用委派名额。独立复杂事项创建执行子会话，可继续按复杂度拆分，执行委派最大深度默认 2。点击左侧会话打开该会话，有下级时同时切换展开／收起，叶子只打开。</p><p>孙子任务完成只通知直接父会话。父会话完成自身集成事项后，再将自己的任务标记完成并通知上层。父会话等待下层时释放并发名额。</p><h3>3. 增补与变更</h3><p>增补事项默认归入当前正在执行或已选中的任务下，不新建主任务。从只读记录发起增补时，返回实际执行的父会话，预填消息后由用户发送。右侧「在当前任务下增补」只预填消息，发送后才追加子事项。主会话可以明确指定位置，例如「在 T-005 下新增一个移动端检查」或「在“检查浏览器导入兼容性”下新增一个异常文件检查」。支持按任务 ID 或名称定位，无法唯一定位时不创建任务。主会话未选择具体任务时，默认增补到主任务。</p><p>向已完成的任务追加未完成子事项，会重新打开该任务及已完成的祖先，保留原报告与历史。任务有稳定 ID、要求版本与执行尝试号。修改要求会递增版本并使旧执行结果失效；取消保留历史及会话，不计为完成。清单不随对话轮次变化或清空。</p><h3>4. 工具在会话左侧按需展开</h3><table><tr><th>触发</th><th>界面行为</th></tr><tr><td>普通讨论、规划、进度查询</td><td>仅展示会话，不保留常驻工具区或五类工具标签。</td></tr><tr><td>模型需要网页操作</td><td>模拟 browser.open 事件，浏览器页面在会话左侧打开。</td></tr><tr><td>模型需要文件、命令、插件或编排视图</td><td>仅打开该次需要的工具面板，展示当前工具名称与任务绑定。</td></tr><tr><td>收起 / 切换会话</td><td>工具状态按会话独立保留；无工具的会话恢复完整对话宽度。</td></tr><tr><td>窄屏</td><td>执行视图与对话通过「看对话 / 看工具」切换，避免挤压。</td></tr></table><h3>5. 样式对齐依据</h3><p>本文件直接内嵌官方 rc.2 的 ui-theme/base.css 和 design-platform.css，使用同版系统字体、颜色令牌、4/8/12/16/20/28px 圆角体系、浅深色主题。侧栏、会话头、用户气泡、输入框与按钮尺寸根据该版对应组件样式复现。</p><p>核对来源：<a href="https://github.com/deepseek-ai/deepseek-harness/releases/tag/dsh-v0.2.2-rc.2" target="_blank" rel="noopener">官方 rc.2 发布</a>；<a href="https://github.com/deepseek-ai/deepseek-harness/tree/dsh-v0.2.2-rc.2/packages/client" target="_blank" rel="noopener">同版本 UI 源码</a>。任务导航及新编排交互为本需求新增区域，按原生组件规范扩展；并非声称官方已有该功能。</p><h3>6. 验收路径</h3><table><tr><th>路径</th><th>预期</th></tr><tr><td>按需工具</td><td>浏览器场景 → 初始无工具 → 继续执行 → 浏览器出现在会话左侧 → 收起 → 保留操作状态。</td></tr><tr><td>直接完成</td><td>导入样例 → 检查结果 → 模拟执行完成 → 任务立即勾选 → 父会话出现完成通知。</td></tr><tr><td>当前任务增补</td><td>子会话 → 在当前任务下增补 → 发送要求 → 新事项嵌套在当前任务下，会话保持不变。</td></tr><tr><td>主会话指定增补</td><td>发送「在 T-005 下新增一个移动端检查」→ 新事项归入 T-005，主会话保持不变；错误或重名目标不会被自动改到其他任务下。</td></tr><tr><td>递归执行</td><td>拆分 → 孙子完成 → 直接通知子会话 → 本层集成完成 → 子任务完成并通知主会话。</td></tr><tr><td>持久与版本</td><td>多轮查询与刷新不清空；修改要求递增版本，旧执行结果不能完成新版本。</td></tr></table><h3>7. 原型边界</h3><p>本文件离线运行，模型规划、工具动作和任务执行均使用预设演示数据；没有接入真实 DSH、模型、浏览器执行器或命令环境。本地存储用于体验刷新恢复；生产环境需要服务端持久化、运行事件校验与通知幂等。</p><p>旧版原型的本地计划可迁移到 V4，保留 ID 与会话；原先已提交的任务转为已完成并通知父任务。切换演示场景与新建演示是明确替换操作，不属于对话轮次重置。</p></div>',button('close','返回工作区'),true)}

document.addEventListener('input',e=>{if(e.target.id==='session-search'){state.ui.query=e.target.value;save();document.querySelector('#session-tree').innerHTML=renderTree()||'<div class="empty">没有匹配会话</div>'}});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chat(e.target.value)}else if(e.target.matches('.task-row')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectTask(e.target.dataset.id)}});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='system')applyTheme()});
save();render();
</script></body></html>
